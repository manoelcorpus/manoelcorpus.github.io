<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Rádio Ordinária Russas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f0f0; max-width: 1200px; margin: 0 auto; padding: 10px; }

        /* Cabeçalho Promoção */
        .promocao { background: #ffd100; color: #003399; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 10px; }

        /* Layout Principal */
        .container { display: flex; gap: 15px; }
        .conteudo-principal { flex: 3; }
        .lateral { flex: 1; display: flex; flex-direction: column; gap: 15px; }

        /* Web TV e Vídeo */
        .webtv { background: #003399; color: white; padding: 8px; font-weight: bold; }
        .video-container { background: black; position: relative; }
        .video-container iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* Agora na Rádio */
        .agora-radio { background: #003399; color: white; padding: 10px; }
        .agora-radio .conteudo { background: white; color: black; padding: 10px; margin-top: 5px; }

        /* Enquete */
        .enquete { background: #003399; color: white; padding: 10px; }
        .enquete form { background: white; color: black; padding: 15px; margin-top: 5px; }
        .enquete label { display: block; margin: 8px 0; cursor: pointer; }
        .btn { background: #003399; color: white; border: none; padding: 8px 15px; margin: 10px 0; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .btn:hover { background: #002266; }
        .resultados { margin-top: 15px; padding-top: 10px; border-top: 1px solid #ccc; }
        .barra { height: 10px; background: #ddd; margin: 5px 0; border-radius: 5px; overflow: hidden; }
        .preenchimento { height: 100%; background: #003399; width: 0%; transition: width 0.3s; }

        /* Publicidades */
        .publicidades { background: #003399; color: white; padding: 10px; margin-top: auto; }
        .pub-conteudo { background: white; padding: 10px; margin-top: 5px; min-height: 80px; }
    </style>
</head>
<body>

    <!-- Área de Promoção -->
    <div class="promocao">PROMOÇÃO</div>

    <div class="container">
        <!-- Conteúdo Principal -->
        <div class="conteudo-principal">
            <div class="webtv">📺 WEB TV</div>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                        title="Rick Astley - Never Gonna Give You Up (4K Remaster)" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen></iframe>
            </div>
        </div>

        <!-- Barra Lateral -->
        <div class="lateral">
            <!-- Agora na Rádio -->
            <div class="agora-radio">
                <strong>🔊 AGORA NA RÁDIO</strong>
                <div class="conteudo">
                    Forrozão com DJ Filho Manoel<br>
                    14:30 às 16:30
                </div>
            </div>

            <!-- Enquete Funcional -->
            <div class="enquete">
                <strong>📊 ENQUETE</strong>
                <form id="formEnquete">
                    <p>Gostou do site?</p>
                    <label><input type="radio" name="voto" value="sim" required> Sim</label>
                    <label><input type="radio" name="voto" value="nao"> Não</label>
                    <label><input type="radio" name="voto" value="melhorar"> Pode Melhorar</label>
                    <label><input type="radio" name="voto" value="excelente"> Excelente</label>
                    <button type="button" class="btn" id="btnVotar">Votar</button>
                    <button type="button" class="btn" id="btnVerResultados">Ver Resultados</button>

                    <div class="resultados" id="areaResultados" style="display: none;">
                        <strong>Resultado Parcial:</strong><br>
                        Sim: <span id="contSim">0</span> votos
                        <div class="barra"><div class="preenchimento" id="barraSim"></div></div>

                        Não: <span id="contNao">0</span> votos
                        <div class="barra"><div class="preenchimento" id="barraNao"></div></div>

                        Pode Melhorar: <span id="contMelhorar">0</span> votos
                        <div class="barra"><div class="preenchimento" id="barraMelhorar"></div></div>

                        Excelente: <span id="contExcelente">0</span> votos
                        <div class="barra"><div class="preenchimento" id="barraExcelente"></div></div>
                    </div>
                </form>
            </div>

            <!-- Publicidades -->
            <div class="publicidades">
                <strong>📢 PUBLICIDADES</strong>
                <div class="pub-conteudo">
                    Espaço para anúncios
                </div>
            </div>
        </div>
    </div>

    <script>
        // Armazena os votos (funciona mesmo fechando e abrindo o site)
        let votos = JSON.parse(localStorage.getItem('votosEnquete')) || {
            sim: 0, nao: 0, melhorar: 0, excelente: 0
        };

        // Atualiza os números e barras na tela
        function atualizarResultados() {
            document.getElementById('contSim').textContent = votos.sim;
            document.getElementById('contNao').textContent = votos.nao;
            document.getElementById('contMelhorar').textContent = votos.melhorar;
            document.getElementById('contExcelente').textContent = votos.excelente;

            const total = votos.sim + votos.nao + votos.melhorar + votos.excelente || 1;
            document.getElementById('barraSim').style.width = `${(votos.sim / total) * 100}%`;
            document.getElementById('barraNao').style.width = `${(votos.nao / total) * 100}%`;
            document.getElementById('barraMelhorar').style.width = `${(votos.melhorar / total) * 100}%`;
            document.getElementById('barraExcelente').style.width = `${(votos.excelente / total) * 100}%`;

            localStorage.setItem('votosEnquete', JSON.stringify(votos));
        }

        // Botão Votar
        document.getElementById('btnVotar').addEventListener('click', () => {
            const opcao = document.querySelector('input[name="voto"]:checked');
            if (!opcao) {
                alert('Escolha uma opção antes de votar!');
                return;
            }
            votos[opcao.value]++;
            atualizarResultados();
            alert('Voto registrado com sucesso!');
            document.getElementById('formEnquete').reset();
        });

        // Botão Ver Resultados
        document.getElementById('btnVerResultados').addEventListener('click', () => {
            const area = document.getElementById('areaResultados');
            area.style.display = area.style.display === 'none' ? 'block' : 'none';
            atualizarResultados();
        });

        // Carrega os resultados ao abrir a página
        window.addEventListener('load', atualizarResultados);
    </script>

</body>
</html>
