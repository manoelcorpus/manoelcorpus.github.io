<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Acesso - Web Rádio Ordinária Russas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #003399, #001a4d); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .caixa { background: white; padding: 35px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.3); }
        .aviso-versao { background: #ff9900; color: black; padding: 8px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        h2 { color: #003399; margin-bottom: 20px; }
        .campo { margin-bottom: 15px; text-align: left; }
        .campo label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .campo input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .botao { width: 100%; padding: 12px; background: #ff9900; color: black; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .botao:hover { background: #ff8000; }
        .botao-secundario { background: #666; color: white; margin-top: 10px; }
        .erro { color: #d32f2f; margin-top: 10px; display: none; font-weight: bold; padding: 8px; background: #ffebee; border-radius: 5px; }
        .sucesso { color: #2e7d32; margin-top: 10px; display: none; font-weight: bold; padding: 8px; background: #e8f5e9; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="aviso-versao">✅ CÓDIGO NOVO CARREGADO!</div>
        <h2>Acesso Administrativo</h2>
        
        <div class="campo">
            <label>Usuário</label>
            <input type="text" value="admin" readonly>
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" id="campoSenha" placeholder="Digite: russas2026">
        </div>

        <button class="botao" id="btnEntrar">Entrar</button>
        <button class="botao botao-secundario" onclick="alert('Se apareceu essa mensagem, o site está funcionando!')">Verificar Código</button>

        <div class="erro" id="msgErro"></div>
        <div class="sucesso" id="msgSucesso"></div>
    </div>

<script>
// SENHA FIXA NO CÓDIGO PARA NÃO TER ERRO
const SENHA_CORRETA = "russas2026";

document.getElementById('btnEntrar').addEventListener('click', () => {
    const senhaDigitada = document.getElementById('campoSenha').value.trim();
    const erro = document.getElementById('msgErro');
    const sucesso = document.getElementById('msgSucesso');
    
    erro.style.display = 'none';
    sucesso.style.display = 'none';

    if(senhaDigitada === SENHA_CORRETA){
        sucesso.textContent = "🎉 DEU CERTO! Você entrou no painel!";
        sucesso.style.display = 'block';
        setTimeout(() => alert('Agora funciona normalmente! Bora montar o site completo'), 2000);
    } else {
        erro.textContent = "❌ Senha incorreta! Digite: russas2026";
        erro.style.display = 'block';
    }
});
</script>
</body>
</html>
