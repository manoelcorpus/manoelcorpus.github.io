<!DOCTYPE html>
<html lang="pt‑BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rádio Russas Ordinária</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:#fff;line-height:1.6}
header{background:#e67700;padding:20px;text-align:center}
.banner{width:100%;max-width:800px;height:220px;background:#222;margin:15px auto;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#aaa}
.container{max-width:800px;margin:0 auto;padding:20px}
.player{background:#222;padding:25px;border-radius:10px;text-align:center;margin:20px 0}
.status{font-size:18px;margin-bottom:15px;color:#ffaa22}
audio{width:100%;margin:10px 0}
.btn{background:#e67700;border:none;color:#fff;padding:12px 24px;border-radius:6px;font-size:16px;margin:8px;cursor:pointer}
.btn‑adm{background:#333}
.horarios{background:#222;padding:20px;border-radius:8px;margin:20px 0}
.painel{display:none;background:#1a1a1a;padding:20px;border-radius:10px;margin-top:20px}
.campo{width:100%;padding:10px;margin:10px 0;border-radius:4px;border:none;background:#333;color:#fff}
.aviso{background:#2a2a2a;padding:15px;border-radius:6px;margin:15px 0}
</style>
</head>
<body>
<header>
  <h1 id="nomeRadio">Rádio Russas Ordinária</h1>
  <p>Sua rádio ao vivo 24h</p>
</header>
<div class="container">
  <div class="banner" id="bannerArea">
    [https://twitter.com/hashtag/magic104?utm_source=Pinterest&utm_medium=organic]
  </div>

  <div class="player">
    <div class="status">🟠 NO AR</div>
    <audio id="playerAudio" controls>
      <source src="https://stream.zeno.fm/tnzj3smf3abvv" type="audio/mpeg">
      Seu navegador não suporta áudio.
    
    <button class="btn" onclick="tocarRadio()">OUVIR AGORA</button>
  </div>

  <div class="horarios">
    <h3>📅 Programação</h3>
    <p>06:00 — Manhã da Alegria</p>
    <p>12:00 — Almoço com Música</p>
    <p>18:00 — Noite de Sucessos</p>
  </div>

  <button class="btn btn‑adm" onclick="abrirLogin()">🔐 Área de Administração</button>

  <div id="telaLogin" style="display:none;background:#1a1a1a;padding:20px;border-radius:10px">
    <h3>Acesso ADM</h3>
    <input type="password" id="senhaInput" class="campo" placeholder="Digite a senha">
    <button class="btn" onclick="verificarSenha()">Entrar</button>
  </div>

  <div id="painelAdm" class="painel">
    <h3>Painel de Controle</h3>
    <input type="text" id="novoNome" class="campo" placeholder="Nome da rádio">
    <input type="text" id="linkBanner" class="campo" placeholder="Link da imagem do banner">
    <input type="text" id="linkStream" class="campo" placeholder="Link do stream">
    <textarea id="textoAviso" class="campo" placeholder="Escreva avisos para o site"></textarea>
    <button class="btn" onclick="salvarAlteracoes()">Salvar Alterações</button>
    <button class="btn" onclick="sairAdm()">Sair</button>
  </div>

  <div class="aviso" id="caixaAviso"></div>
</div>

<script>
const senhaCorreta = "radio123";

let dados = JSON.parse(localStorage.getItem("dadosRadio")) || {
  nome:"Rádio Russas Ordinária",
  banner:"",
  stream:"https://stream.zeno.fm/tnzj3smf3abvv",
  aviso:"Bem‑vindo à Rádio Russas Ordinária!"
};

function carregarDados(){
  document.getElementById("nomeRadio").innerText = dados.nome;
  if(dados.banner) document.getElementById("bannerArea").innerHTML = <img src="${dados.banner}" style="width:100%;border-radius:8px">;
  document.getElementById("playerAudio").src = dados.stream;
  document.getElementById("caixaAviso").innerText = dados.aviso;
}

function tocarRadio(){
  const audio = document.getElementById("playerAudio");
  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
}

function abrirLogin(){
  document.getElementById("telaLogin").style.display = "block";
  document.getElementById("painelAdm").style.display = "none";
}

function verificarSenha(){
  const senhaDigitada = document.getElementById("senhaInput").value.trim();
  if(senhaDigitada === senhaCorreta){
    document.getElementById("telaLogin").style.display = "none";
    document.getElementById("painelAdm").style.display = "block";
    document.getElementById("novoNome").value = dados.nome;
    document.getElementById("linkBanner").value = dados.banner;
    document.getElementById("linkStream").value = dados.stream;
    document.getElementById("textoAviso").value = dados.aviso;
  }else{
    alert("Senha incorreta!");
  }
}

function salvarAlteracoes(){
  dados.nome = document.getElementById("novoNome").value;
  dados.banner = document.getElementById("linkBanner").value;
  dados.stream = document.getElementById("linkStream").value;
  dados.aviso = document.getElementById("textoAviso").value;
  localStorage.setItem("dadosRadio", JSON.stringify(dados));
  carregarDados();
  alert("Alterações salvas!");
}

function sairAdm(){
  document.getElementById("painelAdm").style.display = "none";
  document.getElementById("senhaInput").value = "";
}

carregarDados();
</script>
</body>
</html>
